name: Build Unity Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project Files & Clean Git Status
        run: |
          if [ -f Castlevania_Unity_Project.zip ]; then
            unzip -o Castlevania_Unity_Project.zip -d .
            rm Castlevania_Unity_Project.zip
            git config --global user.name "github-actions"
            git config --global user.email "actions@github.com"
            git add -A
            git commit -m "Auto-clean workspace before build" || true
          fi

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run Unity Android Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildName: CastlevaniaForestDefense
          buildsPath: build
          versioning: None

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Castlevania-APK
          path: build/Android/CastlevaniaForestDefense.apk
