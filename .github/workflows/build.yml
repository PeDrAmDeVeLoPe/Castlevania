name: Build Android APK (No License Required)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wrap and Build Native Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>Castlevania: Forest Defense</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
              body { background: #05160a; color: #fff; font-family: monospace; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
              #container { position: relative; flex: 1; display: flex; }
              canvas { background: #081c0d; width: 100%; height: 100%; object-fit: contain; }
              #ui { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; font-size: 16px; font-weight: bold; pointer-events: none; text-shadow: 2px 2px #000; }
              #shop { position: absolute; bottom: 12px; left: 10px; right: 10px; display: flex; justify-content: center; gap: 12px; }
              .btn { background: #1b4324; border: 2px solid #4ade80; color: #fff; padding: 10px 14px; border-radius: 8px; font-weight: bold; }
              .btn.active { background: #22c55e; border-color: #fff; }
            </style>
          </head>
          <body>
            <div id="container">
              <canvas id="c" width="800" height="450"></canvas>
              <div id="ui">
                <div>GOLD: <span id="gold">150</span></div>
                <div>BASE HP: <span id="hp">100</span></div>
                <div>WAVE: <span id="wave">1</span></div>
              </div>
              <div id="shop">
                <button class="btn active" id="b1" onclick="setT('stake')">Stake Tower (50g)</button>
                <button class="btn" id="b2" onclick="setT('fire')">Flame Altar (90g)</button>
              </div>
            </div>
            <script>
              const c = document.getElementById('c'), ctx = c.getContext('2d');
              let gold = 150, hp = 100, wave = 1, sel = 'stake', towers = [], enemies = [], shots = [], timer = 100, spawning = 0;
              const path = [{x:0,y:220},{x:220,y:220},{x:220,y:100},{x:450,y:100},{x:450,y:340},{x:660,y:340},{x:660,y:220},{x:800,y:220}];
              function setT(t){ sel = t; document.getElementById('b1').className = t==='stake'?'btn active':'btn'; document.getElementById('b2').className = t==='fire'?'btn active':'btn'; }
              c.addEventListener('click', e => {
                const r = c.getBoundingClientRect(), x = (e.clientX - r.left)*(800/r.width), y = (e.clientY - r.top)*(450/r.height);
                let onP = false;
                for(let i=0; i<path.length-1; i++){
                  let p1=path[i], p2=path[i+1], l2=(p2.x-p1.x)**2+(p2.y-p1.y)**2;
                  let t = Math.max(0, Math.min(1, ((x-p1.x)*(p2.x-p1.x)+(y-p1.y)*(p2.y-p1.y))/l2));
                  if(Math.hypot(x-(p1.x+t*(p2.x-p1.x)), y-(p1.y+t*(p2.y-p1.y))) < 35) onP = true;
                }
                if(onP) return;
                let cost = sel==='stake'?50:90;
                if(gold >= cost){ gold -= cost; towers.push({x, y, t: sel, cd: 0, r: sel==='stake'?120:150, dmg: sel==='stake'?25:45}); document.getElementById('gold').textContent = gold; }
              });
              function loop(){
                if(--timer <= 0 && !spawning){ spawning = 5 + wave * 2; }
                if(spawning && Math.random() < 0.04){ enemies.push({p: 0, x: path[0].x, y: path[0].y, hp: 60+wave*25, mhp: 60+wave*25, s: 1.6}); spawning--; if(spawning<=0){ timer = 400; wave++; document.getElementById('wave').textContent = wave; } }
                for(let i=enemies.length-1; i>=0; i--){
                  let e = enemies[i], t = path[e.p+1];
                  if(!t){ hp -= 10; document.getElementById('hp').textContent = hp; enemies.splice(i,1); continue; }
                  let d = Math.hypot(t.x-e.x, t.y-e.y);
                  if(d < e.s) e.p++; else { e.x += ((t.x-e.x)/d)*e.s; e.y += ((t.y-e.y)/d)*e.s; }
                }
                towers.forEach(tw => {
                  if(tw.cd > 0) tw.cd--;
                  if(tw.cd === 0){
                    let target = null, md = tw.r;
                    enemies.forEach(en => { let d = Math.hypot(en.x-tw.x, en.y-tw.y); if(d < md){ md = d; target = en; } });
                    if(target){ target.hp -= tw.dmg; tw.cd = tw.t==='stake'?35:55; shots.push({x1: tw.x, y
